name: Playwright Tests

# Khi nào workflow này chạy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Cho phép bấm nút "Run workflow" thủ công trên GitHub để test thử
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy code từ repo về máy ảo CI
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Cài Node.js, kèm cache npm để lần chạy sau nhanh hơn
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            pw-practice-app/package-lock.json

      # 3. Cài dependencies cho phần Playwright test (thư mục gốc)
      - name: Install Playwright project dependencies
        run: npm ci

      # 4. Cài trình duyệt Playwright cần (chromium, firefox, webkit) + thư viện hệ thống
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # 5. Cài dependencies cho app Angular (thư mục con)
      - name: Install Angular app dependencies
        working-directory: ./pw-practice-app
        run: npm ci

      # 6. Khởi động Angular app ở chế độ nền (background)
      #    Ghi log ra file để debug nếu app không lên được
      - name: Start Angular app in background
        working-directory: ./pw-practice-app
        run: nohup npm start > ../angular-app.log 2>&1 &

      # 7. Đợi tới khi app thật sự sẵn sàng ở cổng 4200 rồi mới chạy tiếp
      #    (ng serve build lần đầu khá lâu, nên set timeout cao ~180s)
      - name: Wait for Angular app to be ready
        run: npx wait-on http://localhost:4200 --timeout 180000

      # 8. Chạy toàn bộ Playwright test
      - name: Run Playwright tests
        run: npx playwright test

      # 9. In log app Angular ra nếu có bước nào fail, để debug dễ hơn
      - name: Show Angular app log on failure
        if: failure()
        run: cat angular-app.log

      # 10. Luôn upload report (dù pass hay fail) để tải về xem
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # 11. Upload video/trace của các test fail (nếu có) để debug sâu hơn
      - name: Upload test-results (videos, traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14